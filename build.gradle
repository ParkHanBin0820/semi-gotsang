plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5' // 버전을 안정적인 버전으로 변경
    id 'io.spring.dependency-management' version '1.1.5' // 버전을 안정적인 버전으로 변경
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'semigotsang'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // implementation 'org.springframework.boot:spring-boot-starter-webmvc' // 삭제 (web에 포함됨)
    implementation 'org.springframework.boot:spring-boot-starter-web' // webmvc 대신 사용
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // 통합 test 의존성
    // testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // 삭제 (starter-test에 포함됨)

    // 2. DB랑 대화하는 도구 (JPA - 필수)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 3. 코드 줄여주는 마법사 (Lombok - 필수)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 4. DB 드라이버 (MySQL)
    runtimeOnly 'com.mysql:mysql-connector-j'


    // 5. Swagger (API 문서 자동화)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
}

tasks.named('test') {
    useJUnitPlatform()
}